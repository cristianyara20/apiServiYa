name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      # 1. Configurar el entorno de Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # O la versión de Go que utilices

      # 2. Ejecutar las pruebas unitarias y generar el archivo de cobertura
      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      # 3. Escaneo de SonarQube indicando dónde está la cobertura
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=cristianyara20_apiServiYa
            -Dsonar.organization=cristianyara20
            -Dsonar.sources=.
            -Dsonar.go.coverage.reportPaths=coverage.out
