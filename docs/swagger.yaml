basePath: /api/v1
definitions:
  domain.ActividadUsuariosDTO:
    properties:
      anio:
        type: integer
      mes:
        type: integer
      usuarios_activos:
        type: integer
      usuarios_nuevos:
        type: integer
    type: object
  domain.CalificacionDTO:
    properties:
      comentario:
        type: string
      fecha_calificacion:
        type: string
      id_calificacion:
        type: integer
      id_reserva:
        type: integer
      nombre_cliente:
        description: Datos extra para hacerlo más rico
        type: string
      nombre_prestador:
        type: string
      nombre_servicio:
        type: string
      puntuacion:
        type: integer
    type: object
  domain.CancelarReservaRequestDTO:
    properties:
      id_cliente:
        type: integer
    required:
    - id_cliente
    type: object
  domain.CancelarReservaResponseDTO:
    properties:
      estado_reserva:
        type: string
      id_reserva:
        type: integer
      mensaje:
        type: string
    type: object
  domain.LoginRequestDTO:
    properties:
      correo:
        type: string
      password:
        type: string
    required:
    - correo
    - password
    type: object
  domain.LoginResponseDTO:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  domain.NotificationRequestDTO:
    properties:
      estado_reserva:
        type: string
      id_cliente:
        type: integer
      id_prestador:
        type: integer
      id_reserva:
        type: integer
    type: object
  domain.PrestadorDetalladoDTO:
    properties:
      apellido:
        type: string
      calificacion_promedio:
        type: number
      correo:
        type: string
      estado_disponibilidad:
        type: string
      experiencia:
        type: string
      id_prestador:
        type: integer
      nombre:
        type: string
    type: object
  domain.PrestadorTopDTO:
    properties:
      calificacion:
        type: number
      correo_prestador:
        type: string
      id_prestador:
        type: integer
      nombre_prestador:
        type: string
      total_servicios:
        type: integer
    type: object
  domain.ReporteConsolidadoMensualDTO:
    properties:
      anio:
        type: integer
      mes:
        type: integer
      pqrs_abiertas:
        type: integer
      top_prestadores:
        items:
          $ref: '#/definitions/domain.PrestadorTopDTO'
        type: array
      total_aceptadas:
        type: integer
      total_canceladas:
        type: integer
      total_completadas:
        type: integer
      total_pendientes:
        type: integer
      total_reservas:
        type: integer
    type: object
  domain.ReservaHistorialDTO:
    properties:
      descripcion:
        type: string
      direccion:
        type: string
      estado_reserva:
        type: string
      fecha_agenda:
        type: string
      id_cliente:
        type: integer
      id_prestador:
        type: integer
      id_reserva:
        type: integer
      id_servicio:
        type: integer
      nombre_cliente:
        type: string
      nombre_prestador:
        type: string
      nombre_servicio:
        type: string
    type: object
  domain.ServicioPopularDTO:
    properties:
      categoria:
        type: string
      id_servicio:
        type: integer
      nombre_servicio:
        type: string
      veces_solicitado:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API de Reportes generada con Onion Architecture, Unit of Work y Repository
    Pattern
  title: API REST ServiYa (Reportes)
  version: "2.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Inicia sesión en Supabase y devuelve un JWT si el usuario es un
        administrador
      parameters:
      - description: Credenciales del administrador
        in: body
        name: credenciales
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.LoginResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión como administrador
      tags:
      - autenticacion
  /operativo/historial-servicios:
    get:
      description: Devuelve todas las reservas del sistema incluyendo los nombres
        de cliente, servicio, fecha agendada, dirección y estado del servicio.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ReservaHistorialDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtiene el historial completo de servicios/reservas prestadas en la
        plataforma
      tags:
      - operativo
  /operativo/notificar-aceptacion:
    post:
      consumes:
      - application/json
      description: Endpoint que simula o registra la notificación del prestador al
        cliente de que se aceptó la reserva. Por ahora retorna un mensaje exitoso
        de confirmación de notificación.
      parameters:
      - description: Datos de la reserva
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.NotificationRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Informa al cliente que un prestador aceptó su reserva
      tags:
      - operativo
  /operativo/prestadores:
    get:
      description: Devuelve la lista completa de prestadores de la base de datos,
        con nombre, correo, experiencia, calificación promedio y estado (disponible,
        ocupado, inactivo).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PrestadorDetalladoDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtiene la lista de prestadores con su estado de disponibilidad en
        tiempo real
      tags:
      - operativo
  /reportes/actividad-usuarios:
    get:
      description: Devuelve cuántos usuarios nuevos se registraron y cuántos usuarios
        activos (con al menos una reserva) hubo en el mes
      parameters:
      - description: Mes (1-12)
        in: query
        name: mes
        required: true
        type: integer
      - description: Año (ej. 2026)
        in: query
        name: anio
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ActividadUsuariosDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtiene la actividad de usuarios del mes
      tags:
      - reportes
  /reportes/admin:
    get:
      description: Devuelve el top de prestadores, cantidad de pqrs abiertas y estadísticas
        de reservas para un mes y año
      parameters:
      - description: Mes (1-12)
        in: query
        name: mes
        required: true
        type: integer
      - description: Año (ej. 2026)
        in: query
        name: anio
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ReporteConsolidadoMensualDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtiene un reporte consolidado para el administrador
      tags:
      - reportes
  /reportes/admin/pdf:
    get:
      description: Genera y devuelve un documento PDF con los datos de administrador,
        actividad y servicios
      parameters:
      - description: Mes (1-12)
        in: query
        name: mes
        required: true
        type: integer
      - description: Año (ej. 2026)
        in: query
        name: anio
        required: true
        type: integer
      produces:
      - application/pdf
      responses:
        "200":
          description: reporte.pdf
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Descarga el reporte general en PDF
      tags:
      - reportes
  /reportes/calificaciones:
    get:
      description: Devuelve un listado completo con los comentarios, puntuaciones,
        fechas y nombres de los involucrados en cada reserva calificada.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.CalificacionDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtiene todas las calificaciones/reseñas de los servicios
      tags:
      - reportes
  /reportes/servicios-populares:
    get:
      description: Devuelve los 10 servicios con más reservas en el mes y año indicados,
        incluyendo nombre y categoría
      parameters:
      - description: Mes (1-12)
        in: query
        name: mes
        required: true
        type: integer
      - description: Año (ej. 2026)
        in: query
        name: anio
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ServicioPopularDTO'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtiene los servicios más solicitados del mes
      tags:
      - reportes
  /reservas/{id}/cancelar:
    put:
      consumes:
      - application/json
      description: Permite a un cliente cancelar una de sus reservas siempre y cuando
        esté en estado pendiente o aceptada.
      parameters:
      - description: ID de la Reserva
        in: path
        name: id
        required: true
        type: integer
      - description: Datos de cancelación (ID del Cliente)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CancelarReservaRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CancelarReservaResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancela una reserva existente
      tags:
      - reservas
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
